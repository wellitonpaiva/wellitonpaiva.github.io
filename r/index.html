<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#1C1008">
  <meta name="robots" content="noindex">
  <meta name="apple-itunes-app" content="app-id=6801599936">
  <title>A coffee recommended on CoffeeTrac</title>
  <style>
    :root {
      --espresso: #1C1008;
      --caramel: #C8955A;
      --roast: #D4A896;
      --cream: #F0E4D2;
      --muted: #B39B84;
      --line: #3A2A1C;
      --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
      --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; }
    html { background: var(--espresso); }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--espresso);
      color: var(--cream);
      font-family: var(--sans);
      line-height: 1.5;
      -webkit-text-size-adjust: 100%;
    }
    main {
      max-width: 34rem;
      margin: 0 auto;
      padding: 3.5rem 1.5rem 4rem;
    }
    .from {
      margin: 0 0 1.25rem;
      color: var(--roast);
      font-family: var(--serif);
      font-style: italic;
      font-size: 1.1rem;
    }
    h1 {
      margin: 0;
      font-family: var(--serif);
      font-weight: 500;
      font-size: clamp(2.3rem, 9vw, 3.6rem);
      line-height: 1.05;
      letter-spacing: -0.01em;
      overflow-wrap: anywhere;
    }
    .roaster {
      margin: 0.6rem 0 0;
      font-family: var(--serif);
      font-size: 1.25rem;
      color: var(--caramel);
      overflow-wrap: anywhere;
    }
    .section {
      margin-top: 2.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--line);
    }
    h2 {
      margin: 0 0 1rem;
      font-family: var(--serif);
      font-weight: 500;
      font-size: 1.4rem;
      line-height: 1.2;
      overflow-wrap: anywhere;
    }
    .stars {
      margin: 0 0 1.25rem;
      color: var(--caramel);
      font-size: 1.4rem;
      letter-spacing: 0.15em;
    }
    .bars { display: grid; gap: 0.65rem; margin: 0 0 1.5rem; }
    .bar {
      display: grid;
      grid-template-columns: 6.5rem 1fr 2.2rem;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.95rem;
    }
    .bar .label { color: var(--muted); }
    .bar .track { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
    .bar .fill { display: block; height: 100%; background: var(--caramel); }
    .bar .value { text-align: right; font-family: var(--serif); }
    dl {
      margin: 0;
      border-bottom: 1px solid var(--line);
    }
    .row {
      display: grid;
      grid-template-columns: 8rem 1fr;
      gap: 1rem;
      padding: 0.7rem 0;
      border-top: 1px solid var(--line);
    }
    dt { margin: 0; color: var(--muted); font-size: 0.95rem; }
    dd { margin: 0; font-family: var(--serif); font-size: 1.1rem; overflow-wrap: anywhere; }
    blockquote {
      margin: 1.5rem 0 0;
      padding-left: 1.1rem;
      border-left: 3px solid var(--caramel);
      font-family: var(--serif);
      font-size: 1.15rem;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }
    .cta {
      display: inline-block;
      margin-top: 2.75rem;
      padding: 0.85rem 1.4rem;
      background: var(--caramel);
      color: var(--espresso);
      font-weight: 600;
      text-decoration: none;
      border-radius: 6px;
    }
    .cta:hover { background: var(--roast); }
    .cta:focus-visible { outline: 3px solid var(--cream); outline-offset: 3px; }
    .hint { margin: 0.9rem 0 0; color: var(--muted); font-size: 0.95rem; max-width: 30rem; }
    .error h1 { font-size: clamp(1.8rem, 7vw, 2.6rem); }
    .error p { margin: 1rem 0 0; color: var(--muted); font-family: var(--serif); font-size: 1.15rem; }
    @media (max-width: 26rem) {
      .row { grid-template-columns: 1fr; gap: 0.1rem; }
      .bar { grid-template-columns: 5.5rem 1fr 2rem; gap: 0.6rem; }
    }
  </style>
</head>
<body>
  <main id="app">
    <noscript>
      <h1>JavaScript is off</h1>
      <p>Turn it on to see this recommendation, or open the link on a device with CoffeeTrac installed.</p>
    </noscript>
  </main>

  <script>
    (function () {
      // Water is stored as a plain number in the app. Change to 'ml' if that is what the app shows.
      var WATER_UNIT = 'g';

      // Keep these limits in sync with SharedRecommendation.Limit in the app.
      var LIMITS = {
        by: 80, roaster: 80, name: 80, origin: 60, varietal: 60, process: 60, altitude: 40, tasting: 120,
        comment: 1000, method: 40, grind: 40, time: 20, recipeNotes: 200
      };
      var app = document.getElementById('app');

      function el(tag, className, text) {
        var node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = text; // textContent only: never innerHTML
        return node;
      }

      function clean(value, max) {
        return typeof value === 'string' ? value.trim().slice(0, max) : '';
      }

      // A real JSON number within range, rounded to one decimal, or null.
      function num(value, min, max, minInclusive) {
        if (typeof value !== 'number' || !isFinite(value) || value > max) return null;
        if (minInclusive ? value < min : value <= min) return null;
        return Math.round(value * 10) / 10;
      }

      function fmt(n) { return String(Math.round(n * 10) / 10); }

      function decode(param) {
        var b64 = param.replace(/-/g, '+').replace(/_/g, '/');
        b64 += '='.repeat((4 - (b64.length % 4)) % 4);
        var bin = atob(b64);
        var bytes = Uint8Array.from(bin, function (c) { return c.charCodeAt(0); });
        return JSON.parse(new TextDecoder().decode(bytes));
      }

      function parseReview(r) {
        if (!r || typeof r !== 'object') return null;
        var rating = Number.isInteger(r.rating) && r.rating >= 1 && r.rating <= 5 ? r.rating : 0;
        var attrs = [
          ['Body', num(r.body, 0, 5, true)],
          ['Sweetness', num(r.sweetness, 0, 5, true)],
          ['Bitterness', num(r.bitterness, 0, 5, true)],
          ['Acidity', num(r.acidity, 0, 5, true)]
        ].filter(function (a) { return a[1] !== null; });
        var note = clean(r.note, LIMITS.comment);
        if (!rating && !attrs.length && !note) return null;
        return { rating: rating, attrs: attrs, note: note };
      }

      function parseRecipe(r) {
        if (!r || typeof r !== 'object') return null;
        var recipe = {
          method: clean(r.method, LIMITS.method),
          coffee: num(r.coffee, 0, 200, false),
          water: num(r.water, 0, 5000, false),
          temp: num(r.temp, 0, 100, false),
          grind: clean(r.grind, LIMITS.grind),
          time: clean(r.time, LIMITS.time),
          notes: clean(r.notes, LIMITS.recipeNotes)
        };
        if (!recipe.method && recipe.coffee === null && recipe.water === null) return null;
        return recipe;
      }

      function parse() {
        var param = new URLSearchParams(location.search).get('d');
        if (!param || param.length > 4000) return null;
        var raw;
        try { raw = decode(param); } catch (e) { return null; }
        if (!raw || typeof raw !== 'object' || raw.v !== 1) return null;

        var rec = {
          by: clean(raw.by, LIMITS.by),
          roaster: clean(raw.roaster, LIMITS.roaster),
          name: clean(raw.name, LIMITS.name),
          origin: clean(raw.origin, LIMITS.origin),
          varietal: clean(raw.varietal, LIMITS.varietal),
          process: clean(raw.process, LIMITS.process),
          altitude: clean(raw.altitude, LIMITS.altitude),
          tasting: clean(raw.tasting, LIMITS.tasting),
          score: num(raw.score, 0, 100, false),
          review: parseReview(raw.review),
          recipe: parseRecipe(raw.recipe)
        };
        if (!rec.name && !rec.roaster) return null;
        return rec;
      }

      function showError() {
        app.className = 'error';
        app.replaceChildren(
          el('h1', '', 'This link is incomplete'),
          el('p', '', 'Ask the person who sent it to share the coffee again from CoffeeTrac.')
        );
      }

      // A definition list from [label, value] pairs. Empty values are skipped.
      function list(rows) {
        var shown = rows.filter(function (r) { return r[1]; });
        if (!shown.length) return null;
        var dl = el('dl');
        shown.forEach(function (r) {
          var row = el('div', 'row');
          row.append(el('dt', '', r[0]), el('dd', '', String(r[1])));
          dl.append(row);
        });
        return dl;
      }

      function section(title) {
        var s = el('section', 'section');
        s.append(el('h2', '', title));
        for (var i = 1; i < arguments.length; i++) {
          if (arguments[i]) s.append(arguments[i]);
        }
        return s;
      }

      function reviewSection(by, review) {
        var parts = [];
        if (review.rating) {
          var stars = el('p', 'stars', '\u2605'.repeat(review.rating) + '\u2606'.repeat(5 - review.rating));
          stars.setAttribute('role', 'img');
          stars.setAttribute('aria-label', by + ' rated it ' + review.rating + ' out of 5');
          parts.push(stars);
        }
        if (review.attrs.length) {
          var bars = el('div', 'bars');
          review.attrs.forEach(function (a) {
            var bar = el('div', 'bar');
            bar.setAttribute('role', 'meter');
            bar.setAttribute('aria-label', a[0]);
            bar.setAttribute('aria-valuemin', '0');
            bar.setAttribute('aria-valuemax', '5');
            bar.setAttribute('aria-valuenow', String(a[1]));
            var track = el('span', 'track');
            var fill = el('span', 'fill');
            fill.style.width = (a[1] / 5 * 100) + '%';
            track.append(fill);
            bar.append(el('span', 'label', a[0]), track, el('span', 'value', fmt(a[1])));
            bars.append(bar);
          });
          parts.push(bars);
        }
        if (review.note) parts.push(el('blockquote', '', review.note));
        return section.apply(null, [by + '\u2019s take'].concat(parts));
      }

      function recipeSection(recipe) {
        var ratio = recipe.coffee && recipe.water ? '1:' + Math.round(recipe.water / recipe.coffee) : '';
        var rows = list([
          ['Method', recipe.method],
          ['Coffee', recipe.coffee ? fmt(recipe.coffee) + ' g' : ''],
          ['Water', recipe.water ? fmt(recipe.water) + ' ' + WATER_UNIT : ''],
          ['Ratio', ratio],
          ['Temperature', recipe.temp ? fmt(recipe.temp) + ' \u00B0C' : ''],
          ['Grind', recipe.grind],
          ['Time', recipe.time]
        ]);
        return section('The recipe', rows, recipe.notes ? el('blockquote', '', recipe.notes) : null);
      }

      function show(rec) {
        var by = rec.by || 'A friend';
        var title = rec.name || rec.roaster;
        document.title = title + ' \u2013 recommended on CoffeeTrac';

        var nodes = [el('p', 'from', by + ' recommends'), el('h1', '', title)];
        if (rec.name && rec.roaster) nodes.push(el('p', 'roaster', rec.roaster));

        if (rec.review) nodes.push(reviewSection(by, rec.review));

        var coffee = list([
          ['Origin', rec.origin],
          ['Varietal', rec.varietal],
          ['Process', rec.process],
          ['Altitude', rec.altitude],
          ['Cupping score', rec.score ? fmt(rec.score) : ''],
          ['Tasting notes', rec.tasting]
        ]);
        if (coffee) nodes.push(section('The coffee', coffee));

        if (rec.recipe) nodes.push(recipeSection(rec.recipe));

        var cta = el('a', 'cta', 'Get CoffeeTrac on the App Store');
        cta.href = 'https://apps.apple.com/app/id6801599936';
        nodes.push(cta, el('p', 'hint', 'Add this coffee to your To Try list, then log your own review once you have brewed it.'));

        app.replaceChildren.apply(app, nodes);
      }

      var rec = parse();
      if (rec) show(rec); else showError();
    })();
  </script>
</body>
</html>
